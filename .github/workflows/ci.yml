name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clipplus-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build candidate once
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build Framework smoke harness
        run: dotnet build tests/ClipPlus.WindowsSmoke/ClipPlus.WindowsSmoke.csproj -c Release
      - name: Validate setup script syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1,tests/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Validate released fixture inventory
        shell: pwsh
        run: |
          $inventory = (Import-PowerShellDataFile tests/Released-Fixtures.psd1).Releases
          if (@($inventory | Group-Object Version | Where-Object Count -ne 1).Count -ne 0) {
            throw 'Duplicate release fixture.'
          }
          foreach ($release in $inventory) {
            if ($release.Suite -notin @('legacy','releases') -or
                $release.SetupHash -cnotmatch '^[0-9A-F]{64}$' -or
                $release.ExeHash -cnotmatch '^[0-9A-F]{64}$') {
              throw "Invalid release fixture: $($release.Version)"
            }
          }
          if (@($inventory | Where-Object Suite -eq 'legacy').Count -eq 0 -or
              @($inventory | Where-Object Suite -eq 'releases').Count -eq 0) {
            throw 'A release lifecycle suite is empty.'
          }
      - name: Verify shortcut helper completion observations
        shell: pwsh
        run: ./tests/Shortcut-Completion-Smoke.ps1
      - name: Build portable executable and graphical installer
        shell: pwsh
        run: ./scripts/Build-Package.ps1 -BuildFaultHarness
      - name: Upload shared unverified build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClipPlus-Candidate
          path: |
            artifacts/ClipPlus.exe
            artifacts/ClipPlus.exe.sha256
            artifacts/ClipPlus-Setup.exe
            artifacts/ClipPlus-Setup.exe.sha256
            artifacts/ClipPlus-Setup-FaultTest.exe
            artifacts/THIRD-PARTY-NOTICES.txt
            artifacts/LICENSE.txt
            tests/ClipPlus.WindowsSmoke/bin/Release/net472/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows core, native and performance
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ClipPlus-Candidate
          path: .
          digest-mismatch: error
      - name: Test core on Windows
        run: dotnet test tests/ClipPlus.Tests/ClipPlus.Tests.csproj -c Release --verbosity minimal
      - name: Run Framework native clipboard and WPF smoke
        shell: pwsh
        run: |
          & ./tests/ClipPlus.WindowsSmoke/bin/Release/net472/ClipPlus.WindowsSmoke.exe --isolated-desktop
          exit $LASTEXITCODE
      - name: Measure released-source baseline and candidate WPF performance
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber | Format-List
          New-Item -ItemType Directory -Path TestResults -Force | Out-Null
          $baseline = Join-Path $env:RUNNER_TEMP 'clipplus-performance-v026'
          git fetch --no-tags origin refs/tags/v0.2.6:refs/tags/v0.2.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git worktree add --detach $baseline d43d0047f5c6daea74ae02249473a92cd7808673
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            $source = Join-Path $baseline 'tests/ClipPlus.WindowsSmoke'
            Copy-Item tests/ClipPlus.WindowsSmoke/Program.Benchmark.cs $source
            dotnet build (Join-Path $source 'ClipPlus.WindowsSmoke.csproj') -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & (Join-Path $source 'bin/Release/net472/ClipPlus.WindowsSmoke.exe') --isolated-desktop --popup-benchmark | Tee-Object TestResults/performance-v026.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ./tests/ClipPlus.WindowsSmoke/bin/Release/net472/ClipPlus.WindowsSmoke.exe --isolated-desktop --popup-benchmark | Tee-Object TestResults/performance-v027.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($file in @('TestResults/performance-v026.txt','TestResults/performance-v027.txt')) {
              if (-not (Select-String -Path $file -Pattern 'BENCH first-open-recent') -or
                  -not (Select-String -Path $file -Pattern 'BENCH idle-quick-expanded') -or
                  -not (Select-String -Path $file -Pattern 'BENCH motion-quick-expanded')) {
                throw "Interactive WPF benchmark incomplete: $file"
              }
            }
            if (-not (Select-String -Path TestResults/performance-v027.txt -Pattern 'BENCH floating-expand-final') -or
                -not (Select-String -Path TestResults/performance-v027.txt -Pattern 'BENCH idle-floating-after-cycles')) {
              throw 'Floating transition and resource measurements did not run.'
            }
          } finally { git worktree remove --force $baseline }
      - name: Upload synthetic popup visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClipPlus-UI-Evidence
          path: |
            TestResults/categories-*.png
            TestResults/quick-*.png
            TestResults/performance-*.txt
          if-no-files-found: ignore
          retention-days: 14

  lifecycle:
    name: Lifecycle (${{ matrix.suite }})
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [candidate, legacy, releases]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ClipPlus-Candidate
          path: .
          digest-mismatch: error
      - name: Retrieve exact released installer fixtures for this suite
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE: ${{ matrix.suite }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'clipplus-released'
          $inventory = (Import-PowerShellDataFile tests/Released-Fixtures.psd1).Releases
          # The legacy interrupted-journal fixture uses exact v0.2.0 source;
          # do not depend on the benchmark job's separate Git worktree.
          if ($env:SUITE -eq 'legacy') {
            git fetch --depth=1 --no-tags origin refs/tags/v0.2.0:refs/tags/v0.2.0
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ((git rev-parse 'v0.2.0^{commit}') -ne 'f6199139acfe26b30c04b931b5819e9da10ed986') {
              throw 'Released v0.2.0 source identity mismatch.'
            }
          }
          foreach ($release in @($inventory | Where-Object Suite -eq $env:SUITE)) {
            gh release download $release.Version --repo "${{ github.repository }}" --pattern ClipPlus-Setup.exe --dir (Join-Path $root $release.Version)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Exercise lifecycle on isolated Windows
        shell: pwsh
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          ./tests/Install-Smoke.ps1 -Setup artifacts/ClipPlus-Setup.exe -Portable artifacts/ClipPlus.exe -FaultSetup artifacts/ClipPlus-Setup-FaultTest.exe -FixtureDirectory (Join-Path $env:RUNNER_TEMP 'clipplus-released') -Suite $env:SUITE

  verified:
    name: Verified release candidate
    needs: [build, windows, lifecycle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ClipPlus-Candidate
          path: .
          digest-mismatch: error
      - name: Verify original build checksums
        shell: bash
        working-directory: artifacts
        run: |
          sha256sum --check ClipPlus.exe.sha256 ClipPlus-Setup.exe.sha256
      - name: Upload verified candidate files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClipPlus-Windows
          path: |
            artifacts/ClipPlus.exe
            artifacts/ClipPlus.exe.sha256
            artifacts/ClipPlus-Setup.exe
            artifacts/ClipPlus-Setup.exe.sha256
            artifacts/THIRD-PARTY-NOTICES.txt
            artifacts/LICENSE.txt
          if-no-files-found: error
          retention-days: 14
